name: Deploy slides para o GitHub Pages

on:
  push:
    branches: [main] # Ajuste para master se for o caso do seu repo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: showcase/agv-system-overview/package-lock.json

      - name: Install dependencies
        run: |
          cd showcase/agv-system-overview
          npm ci

      - name: Build
        run: |
          cd showcase/agv-system-overview
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/agv-system-overview/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
